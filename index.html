<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Arnio Team Agent</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0a;
    --surface: #111111;
    --surface2: #181818;
    --border: #222222;
    --border2: #2e2e2e;
    --text: #f0f0f0;
    --muted: #666;
    --muted2: #444;
    --accent: #c8f080;
    --accent-dim: rgba(200, 240, 128, 0.08);
    --accent-dim2: rgba(200, 240, 128, 0.14);
    --user-bg: #1a1f12;
    --user-border: #2d3a1a;
    --font-body: 'DM Sans', sans-serif;
    --font-mono: 'DM Mono', monospace;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    font-size: 15px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 0;
  }

  header {
    width: 100%;
    max-width: 680px;
    padding: 28px 24px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 14px;
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 10;
  }

  .logo {
    width: 38px;
    height: 38px;
    border-radius: 10px;
    background: var(--accent-dim2);
    border: 1px solid rgba(200, 240, 128, 0.25);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .logo svg { width: 18px; height: 18px; }

  .header-text h1 {
    font-size: 15px;
    font-weight: 500;
    color: var(--text);
    letter-spacing: -0.01em;
  }

  .header-text p {
    font-size: 12px;
    color: var(--muted);
    font-family: var(--font-mono);
  }

  .status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--accent);
    margin-left: auto;
    box-shadow: 0 0 8px var(--accent);
    animation: pulse 2.5s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  main {
    width: 100%;
    max-width: 680px;
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 0 24px;
  }

  #chat {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 16px;
    padding: 24px 0 16px;
    overflow-y: auto;
  }

  .msg {
    display: flex;
    flex-direction: column;
    gap: 4px;
    animation: fadeUp 0.2s ease;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg.user { align-items: flex-end; }
  .msg.agent { align-items: flex-start; }

  .bubble {
    max-width: 88%;
    padding: 11px 15px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.65;
    white-space: pre-wrap;
  }

  .msg.agent .bubble {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px 14px 14px 14px;
    color: var(--text);
  }

  .msg.user .bubble {
    background: var(--user-bg);
    border: 1px solid var(--user-border);
    border-radius: 14px 4px 14px 14px;
    color: var(--accent);
    font-family: var(--font-mono);
    font-size: 13px;
  }

  .msg-label {
    font-size: 11px;
    font-family: var(--font-mono);
    color: var(--muted2);
    padding: 0 4px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  .quick-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 4px 0 8px;
  }

  .chip {
    font-size: 12px;
    font-family: var(--font-mono);
    padding: 6px 12px;
    border-radius: 20px;
    border: 1px solid var(--border2);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }

  .chip:hover {
    border-color: rgba(200, 240, 128, 0.3);
    color: var(--accent);
    background: var(--accent-dim);
  }

  .thinking {
    display: flex;
    gap: 5px;
    padding: 14px 16px;
    align-items: center;
  }

  .dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--muted);
    animation: blink 1.2s ease-in-out infinite;
  }

  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }

  @keyframes blink {
    0%, 80%, 100% { opacity: 0.2; }
    40% { opacity: 1; }
  }

  footer {
    width: 100%;
    max-width: 680px;
    padding: 12px 24px 28px;
    border-top: 1px solid var(--border);
    background: var(--bg);
    position: sticky;
    bottom: 0;
  }

  .input-row {
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }

  textarea {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: 10px;
    padding: 11px 14px;
    font-size: 14px;
    font-family: var(--font-body);
    color: var(--text);
    resize: none;
    line-height: 1.5;
    transition: border-color 0.15s;
    min-height: 44px;
    max-height: 120px;
  }

  textarea::placeholder { color: var(--muted2); }

  textarea:focus {
    outline: none;
    border-color: rgba(200, 240, 128, 0.3);
  }

  button#send {
    height: 44px;
    padding: 0 18px;
    background: var(--accent);
    border: none;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 500;
    font-family: var(--font-mono);
    color: #0a0a0a;
    cursor: pointer;
    transition: opacity 0.15s, transform 0.1s;
    white-space: nowrap;
    flex-shrink: 0;
  }

  button#send:hover { opacity: 0.88; }
  button#send:active { transform: scale(0.97); }
  button#send:disabled { opacity: 0.35; cursor: not-allowed; }

  .footer-note {
    font-size: 11px;
    font-family: var(--font-mono);
    color: var(--muted2);
    margin-top: 10px;
    text-align: center;
    letter-spacing: 0.02em;
  }

  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }
</style>
</head>
<body>

<header>
  <div class="logo">
    <svg viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="9" cy="9" r="3" fill="#c8f080"/>
      <circle cx="9" cy="9" r="7" stroke="#c8f080" stroke-width="1" stroke-opacity="0.4"/>
      <circle cx="9" cy="3" r="1.2" fill="#c8f080" opacity="0.7"/>
      <circle cx="9" cy="15" r="1.2" fill="#c8f080" opacity="0.7"/>
      <circle cx="3" cy="9" r="1.2" fill="#c8f080" opacity="0.7"/>
      <circle cx="15" cy="9" r="1.2" fill="#c8f080" opacity="0.7"/>
    </svg>
  </div>
  <div class="header-text">
    <h1>Arnio Team Agent</h1>
    <p>onboarding · support · ops</p>
  </div>
  <div class="status-dot" title="Online"></div>
</header>

<main>
  <div id="chat">
    <div class="msg agent">
      <span class="msg-label">agent</span>
      <div class="bubble">Hey — I'm your Arnio onboarding agent. I know everything about how Arnio works: the product, clients, tools, servers, and your daily tasks.

Ask me anything, or pick a topic below to get started.</div>
    </div>
    <div class="quick-chips">
      <button class="chip" onclick="quickAsk('What is Arnio and what does it do?')">What is Arnio?</button>
      <button class="chip" onclick="quickAsk('What are my daily tasks and responsibilities?')">My daily tasks</button>
      <button class="chip" onclick="quickAsk('Who are the current clients and how do I support them?')">Current clients</button>
      <button class="chip" onclick="quickAsk('How does Slack triage work at Arnio?')">Slack triage</button>
      <button class="chip" onclick="quickAsk('What tools do I need to use and what are they for?')">Tools & tools</button>
      <button class="chip" onclick="quickAsk('When should I escalate something to Greg vs handle it myself?')">When to escalate</button>
    </div>
  </div>
</main>

<footer>
  <div class="input-row">
    <textarea id="input" placeholder="Ask anything about Arnio..." rows="1"></textarea>
    <button id="send" onclick="send()">Send →</button>
  </div>
  <p class="footer-note">arnio.co — internal team use only</p>
</footer>

<script>
const SYSTEM = `You are the Arnio Team Onboarding Agent. You help new team members understand how Arnio works, their responsibilities, and how to handle daily tasks. Be concise, direct, and practical. Always use short bullet points. Never write long paragraphs. Keep it simple.

WHAT IS ARNIO:
- Arnio (arnio.co) is an AI retention operator for Shopify brands
- Detects and fixes underperforming Klaviyo email/SMS campaigns automatically
- Arnio is NOT an email service provider — Klaviyo is the execution rail
- Core insight: email flows decay silently. This is a maintenance problem, not a tool problem.
- Pricing: $999/mo Operator plan, Enterprise custom
- YC tagline: "AI retention operator for ecommerce brands"

PRODUCT:
- V1 flow: Connect Shopify + Klaviyo → detect underperforming abandoned checkout → estimate revenue gap → generate optimized campaign → push draft to Klaviyo → attribute revenue
- Two platforms: (1) Legacy iMessage platform on Contabo VPS, (2) New Klaviyo detection platform on Railway/Neon (main product)
- Tech stack: arnio-core (Express/TypeScript/Drizzle/Neon on Render) + arnio-client (Next.js/Tailwind/Clerk on Vercel)

CURRENT CLIENTS (iMessage platform):
- Calvin Mark → srv02
- Dev Adbuy → srv01 + srv03
- Mac minis at *.arnio.co run BlueBubbles for iMessage delivery
- These clients must remain supported — do not make any changes to their setup

DESIGN PARTNERS (new Klaviyo platform):
- Rally (Miyako) — locked in, signed agreement
- Legendairy Milk (Lexie) — warm lead in progress
- Product ETA for design partner access: July 15, 2026

YOUR DAILY TASKS:
1. Slack triage — check Slack every morning, respond to client messages, flag anything urgent to Greg
2. iMessage support — monitor BlueBubbles alerts for srv01/srv02/srv03, escalate delivery issues immediately
3. Calendar management — review Greg's calendar daily, flag conflicts, prep reminders for meetings
4. Outreach support — help manage Instantly pipeline once set up (leads from ManyChat waitlist)

TOOLS YOU USE:
- Slack — main team comms
- BlueBubbles — iMessage delivery monitoring for legacy clients
- Klaviyo — email/SMS execution (client-side, don't touch without approval)
- Instantly — cold outreach pipeline (being set up)
- ManyChat — lead capture / waitlist leads
- Render — backend hosting (arnio-core)
- Vercel — frontend hosting (arnio-client)
- Railway/Neon — new platform infrastructure

ESCALATION RULES:
- iMessage not sending → check BlueBubbles on the relevant server → escalate to Greg immediately
- Klaviyo campaign issue → document the issue, DM Greg
- Client complaint of any kind → DM Greg before responding
- Never make changes to any client account without Greg's approval
- When in doubt — ask Greg first, act second

ABOUT GREG:
- Greg Jones, Founder & CEO
- Solo founder, previously ran a sportswear brand for 5 years
- Direct communication style — be concise, no fluff, short bullets preferred
- He's focused on dev work and content — don't interrupt unless it's urgent

Always respond in short bullet points. Be direct and honest. If you don't know something specific, say so and suggest asking Greg directly via Slack.`;

let history = [];

async function send() {
  const input = document.getElementById('input');
  const btn = document.getElementById('send');
  const text = input.value.trim();
  if (!text || btn.disabled) return;

  input.value = '';
  input.style.height = 'auto';
  btn.disabled = true;
  btn.textContent = '...';

  appendMsg('user', text);
  history.push({ role: 'user', content: text });

  const thinkDiv = appendThinking();

  try {
    const res = await fetch('/api/chat', {
    method: 'POST',
     headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
  
        system: SYSTEM,
        messages: history
      })
    });
    const data = await res.json();
    const reply = data.content?.[0]?.text || 'Something went wrong. Try again.';
    thinkDiv.remove();
    appendMsg('agent', reply);
    history.push({ role: 'assistant', content: reply });
  } catch (e) {
    thinkDiv.remove();
    appendMsg('agent', 'Network error. Please try again.');
  }

  btn.disabled = false;
  btn.textContent = 'Send →';
}

function appendMsg(role, text) {
  const chat = document.getElementById('chat');
  const wrap = document.createElement('div');
  wrap.className = `msg ${role}`;
  const label = document.createElement('span');
  label.className = 'msg-label';
  label.textContent = role === 'user' ? 'you' : 'agent';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  wrap.appendChild(label);
  wrap.appendChild(bubble);
  chat.appendChild(wrap);
  chat.scrollTop = chat.scrollHeight;
  return wrap;
}

function appendThinking() {
  const chat = document.getElementById('chat');
  const wrap = document.createElement('div');
  wrap.className = 'msg agent';
  const bubble = document.createElement('div');
  bubble.className = 'bubble thinking';
  bubble.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
  wrap.appendChild(bubble);
  chat.appendChild(wrap);
  chat.scrollTop = chat.scrollHeight;
  return wrap;
}

function quickAsk(q) {
  document.getElementById('input').value = q;
  send();
}

const ta = document.getElementById('input');
ta.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
ta.addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 120) + 'px';
});
</script>
</body>
</html>
